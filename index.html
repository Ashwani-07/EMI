<!DOCTYPE html>
<html lang="en">
<head>
    <title>Swipableogin & Signup</title>
</head>
<link rel="stylesheet" href="form.css">
<body>
    <div class="container active-login">
        <div class="welcome-section">
            <div class="bounce">
    
            <h1>Welcome!</h1>
            </div>
            <p>Join our community and enjoy exclusive benefits</p>
        </div>

        <div class="forms-container">
            <div class="form-container login">
                <h2>Login</h2>
                <form>
                    <input type="email" placeholder="Email" required>
                    <input type="password" placeholder="Password" required>
                    <button type="submit">Login</button>
                </form>
                <p>Don't have an account? <span class="switch-form">Sign Up</span></p>
            </div>

            <div class="form-container signup">
                <h2>Sign Up</h2>
                <form>
                    <input type="text" placeholder="Username" required>
                    <input type="email" placeholder="Email" required>
                    <input type="password" placeholder="Password" required>
                    <button type="submit">Register</button>
                </form>
                <p>Already have an account? <span class="switch-form">Login</span></p>
            </div>
        </div>
    </div>

    <script src="form.js"></script>
</body>
</html>
